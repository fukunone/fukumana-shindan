:root {

*, *::before, *::after { box-sizing: border-box; }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 56px;

  font-size: 17px;
  font-weight: 700;

  text-decoration: none;

  cursor: pointer;

  transition: transform .1s, background-color .15s;

.btn:active { transform: scale(.98); }
.btn--primary { background: var(--color-brand); color: #fff; box-shadow: 0 4px 0 var(--color-brand-dark); }

.btn--secondary { background: var(--color-surface); color: var(--color-brand); border-color: var(--color-accent); }
.btn--ghost { background: transparent; color: var(--color-sub); min-height: 48px; font-size: 16px; }
.btn--large { min-height: 64px; font-size: 19px; width: 100%; max-width: 360px; }
.btn--block { width: 100%; }

.screen { padding-top: 8px; }
.screen--top { text-align: center; padding-top: 16px; }

.mascot--top { width: 240px; height: 240px; object-fit: contain; margin: -16px auto -20px; display: block; }
.eyebrow { margin: 8px 0 0; color: var(--color-accent-text); font-weight: 700; letter-spacing: .1em; }
.top-title { margin: 4px 0 16px; font-size: clamp(24px, 7.4vw, 30px); line-height: 1.4; }
.nowrap { display: inline-block; }
h1, h2, .result-hero__catch { word-break: auto-phrase; }
.lead { text-align: left; margin: 0 0 16px; }
.badges { list-style: none; display: flex; justify-content: center; gap: 8px; padding: 0; margin: 0 0 12px; }
.badge {
  background: var(--color-surface);
  border: 2px solid var(--color-line);
  border-radius: 999px;
  padding: 4px 16px;
  font-weight: 700;
}
.privacy {
  background: var(--color-tint);
  color: var(--color-brand);
  border-radius: 12px;
  padding: 12px 16px;
  margin: 0 0 24px;
  font-size: 16px;
  text-align: left;
}

/* ---------- 質問 ---------- */
.progress {
  height: 10px;
  background: var(--color-line);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 8px;
}
.progress__bar { height: 100%; background: var(--color-accent); border-radius: 999px; transition: width .3s; }
.progress__text { margin: 8px 0 0; font-weight: 700; color: var(--color-accent-text); font-size: 18px; }
.progress__text span { color: var(--color-sub); font-size: 16px; }
.question-head { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.mascot--question { flex: 0 0 96px; width: 96px; height: 96px; object-fit: contain; margin: -8px -4px -8px -16px; }
.question { font-size: 22px; line-height: 1.55; margin: 0; flex: 1; min-width: 0; }
.question__note { margin: 0 0 8px; color: var(--color-sub); font-size: 16px; }

.options { list-style: none; padding: 0; margin: 16px 0 24px; display: grid; gap: 12px; }
.option {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
  min-height: 60px;
  padding: 14px 20px;
  background: var(--color-surface);
  border: 2px solid var(--color-line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: border-color .15s, background-color .15s;
}
.option:hover { border-color: var(--color-accent); }
.option.is-selected { border-color: var(--color-brand); background: var(--color-tint); }
.option__label { font-size: 18px; font-weight: 700; line-height: 1.5; }
.option__sub { font-size: 16px; color: var(--color-sub); line-height: 1.5; }
.btn--back { padding-left: 8px; padding-right: 8px; }

/* ---------- 結果 ---------- */
.result-hero {
  position: relative;
  background: var(--color-surface);
  border-radius: 24px;
  box-shadow: var(--shadow);
  border-top: 10px solid var(--type-color);
  padding: 20px 20px 24px;
  text-align: center;
  margin-top: 8px;
}
.result-hero__label { margin: 0; color: var(--color-sub); }
.mascot--result { width: 180px; height: 180px; object-fit: contain; margin: -12px auto -14px; display: block; }
.result-hero__name { color: var(--type-color); font-size: clamp(22px, 6.6vw, 28px); line-height: 1.4; margin: 4px 0 8px; }
.result-hero__catch { font-weight: 700; font-size: 18px; margin: 0 0 12px; text-wrap: balance; }
/* キャッチコピーは読点ごとのかたまりで改行する（かたまりが1行に収まらないときだけ中で折り返す） */
.phrase { display: inline-block; text-wrap: balance; } /* 対応ブラウザでは、かたまりの中の折り返しも行の長さをそろえる */
.option__label { text-wrap: balance; }
.result-hero__desc { text-wrap: pretty; } /* 対応ブラウザでは最終行が1〜2文字だけになるのを避ける */
.result-hero__desc { text-align: left; margin: 0; }

.block {
  background: var(--color-surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-top: 16px;
}
.block__title {
  font-size: 18px;
  margin: 0 0 12px;
  padding-left: 12px;
  border-left: 6px solid var(--type-accent);
  line-height: 1.4;
}

.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; }
.chip {
  background: var(--color-tint); /* color-mix 非対応の古い端末向け */
  border: 2px solid var(--color-line);
  background: color-mix(in srgb, var(--type-accent) 16%, #fff);
  border-color: var(--type-accent);
  border-radius: 999px;
  padding: 4px 14px;
  font-weight: 700;
}

.courses { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.course { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 2px solid var(--color-line); border-radius: 12px; }
.course__no {
  flex: 0 0 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--type-color);
  color: #fff;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.course p { margin: 0; }
.course__kind { font-size: 16px; color: var(--color-sub); }
.course__name { font-weight: 700; font-size: 18px; line-height: 1.5; }
.course__desc { font-size: 16px; }

.advice { margin: 0 0 8px; }
.advice:last-child { margin-bottom: 0; }

.cta + .cta { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--color-line); }
.cta__heading { font-weight: 700; margin: 0 0 8px; }
.cta__sub { font-size: 16px; color: var(--color-sub); margin: 8px 0 0; text-align: center; }

.share { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.share__btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 52px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid transparent;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  text-align: center;
  cursor: pointer;
  line-height: 1.3;
}
.share__btn--x { background: var(--color-x); color: #fff; }
.share__btn--line { background: var(--color-line-app); color: var(--color-line-app-text); }
.share__btn--copy { background: var(--color-surface); border-color: var(--color-line); color: var(--color-text); }
.share__btn--image { background: var(--color-surface); border-color: var(--type-color); color: var(--color-text); }
.share__note { font-size: 16px; color: var(--color-sub); margin: 12px 0 0; }

.screen--result > .btn--ghost { margin-top: 16px; }

/* ---------- 結果ページ（シェアされたリンクの先） ---------- */
.shared-cta { margin-top: 20px; text-align: center; }
.shared-cta .btn { width: 100%; }
.shared-cta__note { color: var(--color-sub); margin: 8px 0 0; }
.type-groups { display: grid; gap: 20px; } /* グループの間は少し広め、グループ内は .types-list の 8px */
.types-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.types-list a {
  display: block;
  padding: 8px 12px;
  border-radius: 10px;
  border: 2px solid var(--color-line);
  border-left: 8px solid var(--type-accent);
  text-decoration: none;
  color: var(--type-color);
  font-weight: 700;

.modal {

.modal__body {

.modal__hint { margin: 0; font-size: 16px; color: var(--color-sub); }

.toast {
  position: fixed;
  left: 50%;
