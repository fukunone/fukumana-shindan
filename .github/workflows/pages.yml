# main ブランチに変更が入るたびに、結果ページ・OGP画像・QRコードを作り直して GitHub Pages に公開します。
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 結果ページ・OGP画像・QRコードを生成
        run: npm run build
      - name: 文言・リンク・全パターンのチェック
        run: npm test
      - name: 公開するファイルをまとめる
        run: |
          mkdir _site
          cp -r index.html .nojekyll css js data r assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
